# CI-based analysis, run by `.github/workflows/ci.yml` (job `test`) after the tests.
# Automatic Analysis has to stay off in SonarQube Cloud, it can't import coverage reports.
sonar.projectKey=mheob_vereinsbote
sonar.organization=mheob

# The app and the repository tooling; the tests are the unit and E2E test files. Sources and tests
# share folders, so the test files are excluded from the sources (else they count as uncovered code).
sonar.sources=apps/web/src,apps/web/e2e,apps/web/vite.config.ts,scripts,vite.config.ts
sonar.exclusions=apps/web/drizzle/**,apps/web/src/routeTree.gen.ts,**/dist/**,**/.vercel/**,coverage/**,**/CHANGELOG.md,**/*.test.ts,**/*.test.tsx,**/*.e2e.ts
# The German and English dictionaries share their key structure by design (en is typed against de).
sonar.cpd.exclusions=apps/web/src/i18n/de.ts,apps/web/src/i18n/en.ts
sonar.tests=apps/web/src,apps/web/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.e2e.ts

# Coverage comes from the unit tests (`vp test --coverage`, see the `test` block in `vite.config.ts`).
# Not part of it: the E2E tests and helpers, the scripts and the build configs, and the code that
# only runs inside the framework or a runtime and is tested end to end by Playwright (`*.e2e.ts`)
# instead: routes, React components, server functions (thin wrappers around the tested `server/`
# modules), the router, the Node and Workers entry points, the migration CLIs and the sample mail CLI
# (`sample-cli.ts`, run by the `design` E2E project).
sonar.coverage.exclusions=apps/web/e2e/**,scripts/**,vite.config.ts,apps/web/vite.config.ts,apps/web/playwright.config.ts,apps/web/src/routes/**,apps/web/src/components/**/*.tsx,apps/web/src/functions/**,apps/web/src/router.tsx,apps/web/src/platform/cloudflare-worker.ts,apps/web/src/platform/node-server.ts,apps/web/src/server/db/*-cli.ts,apps/web/src/server/mail/sample-cli.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
