# CI-based analysis, run by `.github/workflows/ci.yml` (job `test`) after the tests.
# Automatic Analysis has to stay off in SonarQube Cloud, it can't import coverage reports.
sonar.projectKey=mheob_vereinsbote
sonar.organization=mheob

# The app and the repository tooling; the tests are the unit and E2E test files.
sonar.sources=apps/web/src,apps/web/e2e,apps/web/vite.config.ts,scripts,vite.config.ts
sonar.exclusions=apps/web/drizzle/**,apps/web/src/routeTree.gen.ts,**/dist/**,**/.vercel/**,coverage/**,**/CHANGELOG.md
sonar.tests=apps/web/src,apps/web/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.e2e.ts

# Coverage is measured for the app sources, see the `test` block in `vite.config.ts`.
# The E2E tests and helpers, the scripts and the build configs are not part of it.
sonar.coverage.exclusions=apps/web/e2e/**,scripts/**,vite.config.ts,apps/web/vite.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
